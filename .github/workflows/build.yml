name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VHWuWa.sln

      - name: Build
        run: dotnet build VHWuWa.sln -c Release --no-restore

      - name: Test
        run: dotnet test VHWuWa.sln -c Release --no-build --verbosity normal

      - name: Publish app (win-x64, 1 file .exe)
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { [string]$props.Project.PropertyGroup.Version }
          dotnet publish src/VHWuWa.App/VHWuWa.App.csproj -c Release -r win-x64 --self-contained true -p:Version=$ver -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist
          dotnet publish src/VHWuWa.Updater/VHWuWa.Updater.csproj -c Release -r win-x64 --self-contained true -p:Version=$ver -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
          Remove-Item dist/*.pdb -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Làm rối DLL (Obfuscar) — tùy chọn, không chặn build
        continue-on-error: true
        run: |
          dotnet tool install --global Obfuscar.GlobalTool || echo "skip install"
          if (Test-Path obfuscar.xml) { obfuscar.console obfuscar.xml } else { echo "Không có obfuscar.xml — bỏ qua" }
        shell: pwsh

      - name: Kiểm tra app sau publish
        run: if (-not (Test-Path dist/VHWuWa.exe)) { throw "Thiếu VHWuWa.exe" }
        shell: pwsh

      - name: Check Artifact Signing account (release tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          AZURE_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERT_PROFILE }}
        run: |
          foreach ($name in @('AZURE_CLIENT','AZURE_TENANT','AZURE_SUBSCRIPTION',
                              'SIGNING_ENDPOINT','SIGNING_ACCOUNT','SIGNING_PROFILE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing release signing configuration: $name. Refusing unsigned tag build."
            }
          }

      - name: Azure login (release tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign published Windows EXEs (release tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Tag builds are release candidates. Never publish a signed-and-reputable
      # claim unless the Windows binaries have trusted Authenticode signatures.
      # A trusted signing account/certificate must be configured before vNext.
      - name: Smart App Control signature gate on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          ./scripts/Assert-ReleaseSigning.ps1 -PackageRoot dist -RequiredRelativePaths @('VHWuWa.exe','VHWuWa.Updater.exe')

      - name: Đóng gói ZIP
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { [string]$props.Project.PropertyGroup.Version }
          $zip = "VietHoa-WuWa-v$ver.zip"
          New-Item -ItemType Directory -Force update-payload | Out-Null
          Copy-Item dist/* update-payload -Recurse -Force
          if (Test-Path update-payload/VHWuWa.Updater.exe) {
            Move-Item update-payload/VHWuWa.Updater.exe update-payload/VHWuWa.Updater.next.exe -Force
          }
          Compress-Archive -Path update-payload/* -DestinationPath $zip -Force
        shell: pwsh

      - name: Verify signed EXE files inside final ZIP (release tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -File -Filter 'VietHoa-WuWa-v*.zip')
          if ($files.Count -ne 1) { throw 'Release ZIP missing or ambiguous' }
          ./scripts/Assert-ReleaseZipSigning.ps1 -ZipPath $files[0].FullName -RequiredRelativePaths @('VHWuWa.exe','VHWuWa.Updater.next.exe')

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VHWuWa-win-x64
          path: VietHoa-WuWa-v*.zip

      # Bản public đầy đủ còn kèm PAK/font/loader và WAHU Community được dựng
      # trên máy phát hành bằng scripts/build-dist.ps1 + build-community.ps1.
      # Workflow chỉ kiểm tra mã nguồn; không tự tạo Release thiếu dữ liệu game.
